    <p class="small" style="margin-top:10px">Los valores de referencia local deben validarse con la estación del SENAMHI más cercana.</p></div>
  <div class="card"><h3>Cómo comparamos las rotaciones</h3>
    <ul class="reasons" style="margin-top:4px">
      <li><span class="ri">${ic('list',20)}</span><span><b>Armamos 3 rotaciones de 3 años:</b> la que ya haces, una para cuidar el suelo y otra para ahorrar agua y vender.</span></li>
      <li><span class="ri">${ic('sun',20)}</span><span><b>Simulamos 36 meses, mes por mes:</b> cuándo se siembra y cosecha cada cultivo según su época, y qué meses queda el suelo descubierto.</span></li>
      <li><span class="ri">${ic('snow',20)}</span><span><b>Cruzamos con tu clima y tu tierra:</b> si florece con helada, si pide más agua de la que llueve, si deja la tierra descubierta cuando llueve fuerte en una ladera.</span></li>
      <li><span class="ri">${ic('check',20)}</span><span><b>Damos puntos por criterio</b> (suelo, erosión, agua, frío, plagas, venta, forraje). Lo que tú eliges como importante pesa más.</span></li>
    </ul>
    <details><summary>¿Por qué reglas y no inteligencia artificial?</summary><div class="body">No hay todavía datos de cosechas de Chiara para entrenar un modelo. Un modelo de IA entrenado con otras regiones podría equivocarse aquí sin que nadie lo note. Las reglas se pueden leer, discutir y corregir con los técnicos y los agricultores. Cuando haya datos de campo (rendimientos, análisis de suelo), se pueden usar para calibrar los puntos o entrenar un modelo, comparándolo siempre con estas reglas.</div></details>
    <details><summary>¿Qué tan seguros estamos?</summary><div class="body">Cada rotación muestra su nivel de confianza según cuántas fuentes llegaron en vivo. Los datos de cultivos (cuánto tardan, cuánta agua piden) son referencias generales de la FAO y el INIA, y deben validarse con variedades locales. Lo que no sabemos, como el precio de venta o la semilla disponible, lo decimos en cada rotación.</div></details></div>
  <div class="card"><h3>¿Dónde funciona?</h3>
    <p style="font-size:14.5px;line-height:1.5;margin:0">Yachiraq es un <b>piloto en el distrito de Chiara</b> (Ayacucho), entre 3,000 y 4,300 m: unos ${PILOT_KM} km alrededor del pueblo, marcados en el mapa. Fuera de esa zona no damos recomendaciones.</p>
    <p style="font-size:14.5px;line-height:1.5;margin:10px 0 0">Los datos de la NASA cubren todo el mundo. Lo que es de Chiara es:</p>
    <ul style="font-size:14.5px;line-height:1.5;margin:6px 0 0;padding-left:20px"><li>los cultivos y sus épocas de siembra (calendario de lluvias de la sierra sur);</li><li>los pisos de altura quechua, suni y puna;</li><li>la referencia local de temperatura para corregir NASA POWER;</li><li>el cálculo de lluvia y humedad del suelo en Earth Engine.</li></ul>
    <p style="font-size:14.5px;line-height:1.5;margin:10px 0 0">Para llevar Yachiraq a otra zona hay que cambiar esas 4 cosas, de preferencia con técnicos y agricultores del lugar.</p></div>
  <div class="card"><h3>Palabras que usamos</h3><dl class="gloss">
    <dt>Rotación</dt><dd>Cambiar de cultivo en la misma parcela año tras año. Corta el ciclo de las plagas y cuida el suelo.</dd>
    <dt>Leguminosa</dt><dd>Plantas como la haba, el tarwi o la vicia. Toman nitrógeno del aire y lo dejan en el suelo como abono natural.</dd>
    <dt>Anomalía</dt><dd>Cuánto se aleja un dato de lo normal. "−20 % de lluvia" significa que llovió una quinta parte menos que el promedio.</dd>
    <dt>NDVI</dt><dd>Índice de verdor que se calcula con la luz que reflejan las plantas. Una planta sana y con agua refleja más luz infrarroja.</dd>
    <dt>Evapotranspiración</dt><dd>El agua que sale del suelo y de las plantas hacia el aire. Cuando hace calor y viento, el cultivo pide más agua.</dd>

  <div class="review"><b>Yachiraq no reemplaza tu experiencia.</b> Tú conoces tu tierra y tu comunidad. Usa estas ideas para conversar con tu familia, tu técnico o el INIA antes de decidir.</div>`,cta:''};
},

  const inner=$('#panelInner');inner.innerHTML=v.html;
  const c=$('#cta');c.innerHTML=v.cta||'';c.style.display=v.cta?'':'none';
  const inFlow=['locate','draw','analyzing','quiz'].includes(S.screen)&&!S.editing&&!(S.quiz&&S.parcels.some(p=>p.id===S.quiz.id));
  const step=S.screen==='quiz'||S.screen==='analyzing'?2:1;
  $('#hdrMid').innerHTML=inFlow?`<div class="flowsteps">${['Ubicar','Preguntas'].map((l,i)=>`${i?'<span class="sep"></span>':''}<span class="s ${i+1===step?'on':i+1<step?'done':''}"><span class="n">${i+1<step?icm('check',12,3):i+1}</span><span class="lbl">${l}</span></span>`).join('')}</div>`:'';

  if(S.screen==='parcels')bindCarousel();
  if(S.screen==='draw'&&!S.editing&&!COACH.step&&!COACH.shown&&!coachSeen())coachStart();

}

function openParcel(id,tab){S.cur=id;S.tab=tab||S.tab||'hoy';S.justSent=false;S.skipPlan=false;go('parcel');}
function carIdx(){const c=$('#carousel');if(!c)return 0;const cards=[...c.querySelectorAll('.pcard,.add-card')];const mid=c.scrollLeft+c.clientWidth/2;let best=0,bd=1e9;cards.forEach((el,i)=>{const d=Math.abs(el.offsetLeft+el.offsetWidth/2-mid);if(d<bd){bd=d;best=i;}});return best;}
function carGo(i){const c=$('#carousel');if(!c)return;const cards=[...c.querySelectorAll('.pcard,.add-card')];i=Math.max(0,Math.min(cards.length-1,i));const el=cards[i];c.scrollTo({left:el.offsetLeft-(c.clientWidth-el.offsetWidth)/2,behavior:'smooth'});}
function carNav(){const c=$('#carousel');if(!c)return;const n=c.querySelectorAll('.pcard,.add-card').length,i=carIdx();const p=document.querySelector('.cnav.prev'),x=document.querySelector('.cnav.next');if(p)p.disabled=i<=0;if(x)x.disabled=i>=n-1;}
let carDrag=null;
window.addEventListener('pointermove',e=>{if(!carDrag)return;const c=$('#carousel');if(!c){carDrag=null;return;}const dx=e.clientX-carDrag.x;if(Math.abs(dx)>5){carDrag.moved=true;c.classList.add('dragging');}if(carDrag.moved)c.scrollLeft=carDrag.l-dx;});
window.addEventListener('pointerup',()=>{if(!carDrag)return;const c=$('#carousel'),moved=carDrag.moved;carDrag=null;if(!c)return;c.classList.remove('dragging');if(moved){c.dataset.justDragged='1';setTimeout(()=>{delete c.dataset.justDragged;},60);carGo(carIdx());}});
function bindCarousel(){
  const c=$('#carousel');if(!c)return;let t=null;carNav();
  c.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;carDrag={x:e.clientX,l:c.scrollLeft,moved:false};});
  c.addEventListener('scroll',()=>{carNav();clearTimeout(t);t=setTimeout(()=>{const best=carIdx();
    document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i===best));
    const p=S.parcels[best];if(p){S.cur=p.id;document.querySelectorAll('.pcard').forEach(el=>el.classList.toggle('cur',el.dataset.pid===p.id));fitPolys([p.poly],{maxZoom:16,pitch:60});}
    else if(mapReady&&S.parcels.length)fitPolys(S.parcels.map(p=>p.poly),{maxZoom:15});},140);},{passive:true});
}

function newQuiz(poly,stats){return {id:uid(),name:'Parcela '+(S.parcels.length+1),crops:[],sownI:null,prev:[],plan:null,purpose:'casa',water:'secano',animals:'si',poly,stats};}
async function finishDraw(){
  const poly=S.draft.slice();if(poly.length<3)return;
  if(!inPilot(poly)){toast('Esta parcela está fuera de Chiara. Muévela dentro de la zona del piloto.');return;}
  if(S.editing){const p=S.parcels.find(x=>x.id===S.editing);p.poly=poly;S.screen='analyzing';render();clearHandles();
    const [st]=await Promise.all([analyze(poly,p.stats.alt),wait(1400)]);p.stats=st;save();S.editing=null;S.draft=[];toast('Forma guardada. Volvimos a medir tu parcela.');openParcel(p.id,'datos');return;}
  go('analyzing');clearHandles();animateSteps();
  const [st]=await Promise.all([analyze(poly),wait(2400)]);
  S.quiz=newQuiz(poly,st);S.draft=[];go('quiz');
}
function animateSteps(){let i=0;const t=setInterval(()=>{const li=document.querySelectorAll('#anSteps li');if(!li.length||i>=li.length){clearInterval(t);return;}li[i].classList.add('on');i++;},520);}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function finishQuiz(){
  const q=S.quiz;if(q.crops.includes('Descanso'))q.sownI=null;
  const ex=S.parcels.findIndex(p=>p.id===q.id);
  if(ex>=0)S.parcels[ex]=q;else S.parcels.push(q);
  S.quiz=null;save();toast(ex>=0?'Respuestas guardadas':'Parcela guardada');openParcel(q.id,'hoy');
}

/* ===== SMS ===== */
async function sendSms(text,who){
  const out=window.I18N?I18N.t(text):text; // mensaje en el idioma elegido; en pantalla se guarda el original
  const me=S.phone.replace(/\D/g,'');
  let targets=[];
  if(who==='me'){if(me.length<9){toast('Escribe tu número de celular (9 dígitos) abajo.');const s=$('#smsSec');if(s)s.scrollIntoView({behavior:'smooth'});return;}targets=[{name:'Tú',phone:me}];}
  else{targets=S.contacts.slice();if(me.length===9)targets.unshift({name:'Tú',phone:me});if(!S.contacts.length){toast('Agrega contactos de tu comunidad abajo.');const s=$('#smsSec');if(s)s.scrollIntoView({behavior:'smooth'});return;}}
  S.smsSent.push({t:text,to:who==='me'?'Enviado a ti':`Enviado a ${targets.length} personas`});S.justSent=true;keepScroll(render);
  const s=$('#smsSec');if(s)s.scrollIntoView({behavior:'smooth',block:'start'});
  const ph=$('#phone');if(ph){ph.classList.remove('buzz');void ph.offsetWidth;ph.classList.add('buzz');}
  if(navigator.vibrate)navigator.vibrate([120,60,120]);
  const nums=targets.map(t=>'+51'+t.phone);
  if(SMS_ENDPOINT){
    try{
      const rs=await Promise.all(targets.map(t=>fetch(SMS_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:'+51'+t.phone,body:out})}).then(async r=>({ok:r.ok,...(await r.json().catch(()=>({})))})).catch(()=>({ok:false,error:'Sin conexión'}))));
      const okN=rs.filter(r=>r.ok),wa=okN.filter(r=>r.canal==='whatsapp').length,sm=okN.length-wa,bad=rs.length-okN.length;
      const parts=[];if(wa)parts.push(`WhatsApp a ${wa}`);if(sm)parts.push(`SMS a ${sm}`);
      if(!bad)toast('Enviado: '+parts.join(' y '));
      else{const why=(rs.find(r=>!r.ok)||{}).error||'Revisa la configuración.';toast(`${okN.length?'Enviado: '+parts.join(' y ')+'. ':''}No llegó a ${bad}: ${why}`.slice(0,140));}
    }catch(e){toast('No se pudo enviar. Revisa la conexión.');}
  } else if(/Android|iPhone|iPad/i.test(navigator.userAgent)){
    if(nums.length===1)location.href=`https://wa.me/${nums[0].slice(1)}?text=${encodeURIComponent(out)}`;
    else location.href=`sms:${nums.join(',')}${/iPhone|iPad/i.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(out)}`;
  } else toast(who==='me'?'Así llegará a tu celular.':`Así llegará a ${targets.length} personas de tu comunidad.`);
}

/* ===== Voice ===== */
let speaking=null;
function speak(btn){if(!('speechSynthesis' in window)){toast('Tu navegador no puede leer en voz alta.');return;}
  if(speaking===btn){stopSpeak();return;}stopSpeak();
  const u=new SpeechSynthesisUtterance(btn.closest('.bubble').querySelector('.txt').textContent);const en=window.I18N&&I18N.lang==='en';u.lang=en?'en-US':'es-PE';u.rate=0.95;
  const vs=speechSynthesis.getVoices(),es=en?(vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))):(vs.find(v=>/es[-_](PE|419|MX|US)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang)));if(es)u.voice=es;
  u.onend=()=>{btn.classList.remove('on');speaking=null;};btn.classList.add('on');speaking=btn;speechSynthesis.speak(u);}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();if(speaking)speaking.classList.remove('on');speaking=null;}

let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);}

/* ===== Tour corto: cómo dibujar la parcela (se muestra una vez) =====
   La pantalla se oscurece y queda iluminado solo lo que hay que tocar. Avanza cuando el usuario lo hace de verdad. */
const COACH={step:0,shown:false};
function coachSeen(){try{return localStorage.getItem('yachiraq.coach')==='1';}catch(e){return false;}}
function coachStart(){COACH.step=1;COACH.shown=true;COACH.n0=S.draft.length;coachDraw();}
function coachEnd(){COACH.step=0;try{localStorage.setItem('yachiraq.coach','1');}catch(e){}const c=$('#coach');if(c)c.remove();}
function coachDraw(){
  if(!COACH.step)return;
  if(S.screen!=='draw'){coachEnd();return;}
  if(COACH.step===1&&S.draft.length>=3&&S.draft.length>(COACH.n0>=3?COACH.n0:2))COACH.step=2;
  let c=$('#coach');
  if(!c){c=document.createElement('div');c.id='coach';c.className='coach';c.innerHTML='<div class="coach-hole"></div><div class="coach-hand" aria-hidden="true">👆</div><div class="coach-bub" role="dialog" aria-live="polite"></div>';document.body.appendChild(c);
    c.addEventListener('click',e=>{if(e.target.closest('[data-coach]'))coachEnd();});}
  const s1=COACH.step===1,tgt=s1?$('#stage'):($('#cta [data-act="finishDraw"]')||$('#finishBtn'));if(!tgt)return;
  const r=tgt.getBoundingClientRect(),pad=s1?-6:6,hole=c.querySelector('.coach-hole'),hand=c.querySelector('.coach-hand'),bub=c.querySelector('.coach-bub');
  Object.assign(hole.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+2*pad+'px',height:r.height+2*pad+'px',borderRadius:s1?'18px':'16px'});
  const key=s1?'1':'2';
  if(bub.dataset.k!==key){bub.dataset.k=key;
    bub.innerHTML=s1?`<div class="cs">Paso 1 de 2</div><p class="ct">Toca en el mapa cada esquina de tu parcela.</p><p class="cd">Una por una, dando la vuelta.</p><div class="cr"><button class="link-btn" data-coach="skip">Saltar</button></div>`
      :`<div class="cs">Paso 2 de 2</div><p class="ct">Cuando termines, toca aquí.</p><p class="cd">Si un punto quedó mal, arrástralo.</p><div class="cr"><span></span><button class="btn btn-primary" data-coach="ok">Entendido</button></div>`;}
  hand.className='coach-hand '+(s1?'s1':'s2');
  if(s1){const P=[[.36,.32],[.66,.28],[.6,.62]];P.forEach(([x,y],i)=>{hand.style.setProperty('--x'+(i+1),r.left+r.width*x+'px');hand.style.setProperty('--y'+(i+1),r.top+r.height*y+'px');});hand.style.left='';hand.style.top='';}
  else{hand.style.left=r.left+r.width*.7+'px';hand.style.top=r.top+r.height*.55+'px';}
  const h=bub.offsetHeight,w=bub.offsetWidth,cl=x=>Math.max(16,Math.min(innerWidth-w-16,x));
  bub.style.left=cl(r.left+r.width/2-w/2)+'px';
  bub.style.top=(s1?(innerHeight-r.bottom>=h+40?r.bottom+18:Math.max(12,r.bottom-h-26)):Math.max(12,r.top-h-18))+'px';
}
addEventListener('resize',()=>{if(COACH.step)coachDraw();});

(function splash(){
  const sp=$('#splash');if(!sp)return;
  let seen=false;try{seen=sessionStorage.getItem('yachiraq.splash')==='1';sessionStorage.setItem('yachiraq.splash','1');}catch(e){}
  if(seen&&!/[?&]splash/.test(location.search)){sp.remove();return;}
  let gone=false;const out=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>sp.remove(),800);};
  sp.addEventListener('click',out);setTimeout(out,2300);
})();
