<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7A4D">
<title>Yachiraq, Rotaciones para cada parcela</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='3' y='3' width='94' height='94' rx='25' fill='%23098A2A'/%3E%3Cpath d='M50 80V53' stroke='%23B9F92A' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M50 55C49 40 38 28.5 13 29.5C14 46.5 24.5 59 44 62C48 62.6 50 60 50 55Z' fill='%2396EC22'/%3E%3Cpath d='M50 54C51 39 62 27.5 87 28.5C86 45.5 75.5 58 56 61C52 61.6 50 59 50 54Z' fill='%2396EC22'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --ink:#1E2A22; --muted:#59615A; --cream:#F6F2E9; --line:#E4DDCF;
  --green:#2F5D3A; --green-2:#3E7A4C; --green-soft:#E3EEDC;
  --terra:#C2522A; --terra-soft:#F8E3D8; --gold-soft:#FBEFD2; --gold-ink:#6B4A0E;
  --sky:#2F6F99; --sky-soft:#E1EEF5; --violet:#4B3E9C; --violet-soft:#ECE9F7;
  --quechua:#6FA35A; --suni:#C89B4E; --puna:#8C8FA8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Header */
header.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);z-index:6;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;color:var(--green);white-space:nowrap;background:none;border:0;cursor:pointer;padding:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center}
.hdr-mid{flex:1;display:flex;justify-content:center;min-width:0}
.flowsteps{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.flowsteps .s{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.flowsteps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#EFEAE0;font-size:12px;font-weight:700}
.flowsteps .s.on{background:var(--green);color:#fff}.flowsteps .s.on .n{background:#fff;color:var(--green)}
.flowsteps .s.done .n{background:var(--green-soft);color:var(--green)}
.flowsteps .sep{width:16px;height:2px;background:var(--line)}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:var(--terra-soft);color:#8A3418;display:grid;place-items:center;font-weight:700}
.sms-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);padding:6px 10px;border-radius:999px}

/* Layout */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 460px;min-height:0}
.stage{position:relative;min-height:0;overflow:hidden;background:#C9D9DF}
#map{position:absolute;inset:0}
.map-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:linear-gradient(180deg,#D3E5EC,#EDE7D9);color:var(--muted);font-size:14px}
.map-fallback b{color:var(--ink);font-size:16px}
.stage.nomap .map-fallback{display:flex}
.ov{position:absolute;z-index:3}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(30,42,34,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pill.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.ov-top{top:14px;left:50%;transform:translateX(-50%);max-width:calc(100% - 120px);transition:opacity .3s}
.ov-bl{left:14px;bottom:30px;transition:opacity .3s}
.ov-draw{left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:8px;transition:opacity .3s}
.hidden{opacity:0!important;pointer-events:none!important}
.legend{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;box-shadow:0 4px 16px rgba(30,42,34,.10);min-width:170px}
.legend b{font-size:13px;display:block;margin-bottom:6px}
.legend .row{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:4px}
.legend .row i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .row.dim{opacity:.4}
.town-marker{background:var(--ink);color:#fff;font:700 12px Inter,system-ui,sans-serif;padding:5px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap}
.parcel-marker{display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);font:700 13px Inter,system-ui,sans-serif;padding:5px 10px 5px 5px;border-radius:999px;box-shadow:0 3px 12px rgba(0,0,0,.3);white-space:nowrap;cursor:pointer}
.parcel-marker .pi{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px}
.parcel-marker.sel{background:var(--terra);color:#fff}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2F7BD9;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,123,217,.6);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,123,217,.6)}100%{box-shadow:0 0 0 22px rgba(47,123,217,0)}}
.vtx{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--terra);box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:grab;touch-action:none}
.vtx.sel{background:var(--terra);border-color:#fff;transform:scale(1.25)}
.mid{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.85);border:2px dashed var(--terra);color:var(--terra);display:grid;place-items:center;font:700 13px Inter,sans-serif;cursor:pointer;line-height:1}
.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden}
.maplibregl-ctrl-group button{width:36px!important;height:36px!important}

/* Panel */
.panel{position:relative;overflow-y:auto;background:var(--cream);border-left:1px solid var(--line);display:flex;flex-direction:column;scroll-behavior:smooth}
.panel-inner{padding:22px 22px 8px;flex:1;animation:fadeUp .35s ease}
.cta-bar{position:sticky;bottom:0;padding:14px 22px 20px;background:linear-gradient(rgba(246,242,233,0),var(--cream) 32%);display:flex;flex-direction:column;gap:8px;z-index:2}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.guide{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.bubble{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px 10px 14px;font-size:15px;line-height:1.45;flex:1;display:flex;gap:10px;align-items:flex-start}
.bubble .txt{flex:1}
.listen{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#F6F2E9;display:grid;place-items:center;cursor:pointer;color:var(--green)}
.listen.on{background:var(--green);color:#fff}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--terra)}
h1.title{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:29px;line-height:1.1;margin:6px 0 8px;letter-spacing:-.01em}
h2.sec{font-size:16px;font-weight:700;margin:20px 0 10px}
.lead{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700}
.card .sub{margin:-6px 0 12px;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--gold-soft);color:var(--gold-ink)}
.tag.bad{background:var(--terra-soft);color:#8A3418}
.tag.sat{background:var(--sky-soft);color:#1F5576}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;font-weight:600;font-size:15px;cursor:pointer;transition:background .2s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{width:100%;background:var(--green);color:#fff;min-height:56px;font-size:17px}
.btn-primary:hover{background:#264D30}
.btn-primary:disabled{background:#D6CFBF;color:#6E685B;cursor:not-allowed}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#CFC6B4}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:disabled{background:#8B918C;cursor:not-allowed}
.btn-danger{background:#fff;border:1px solid #E9C3B3;color:#8A3418}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.link-btn{background:none;border:0;padding:6px 0;color:var(--green);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.option{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;margin-bottom:10px;transition:border-color .15s}
.option:hover{border-color:var(--green)}
.option .oi{width:46px;height:46px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.option b{display:block;font-size:15px}
.option span{font-size:13px;color:var(--muted)}
.input{min-height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:16px;width:100%}
.input:focus{outline:2px solid var(--green);outline-offset:1px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:#EEE8DB;padding:4px;border-radius:14px}
.seg button{min-height:46px;border:0;border-radius:10px;background:transparent;font-weight:600;cursor:pointer;font-size:14px;color:var(--muted);padding:0 6px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--green)}
.q{margin-bottom:18px}
.ql{display:block;font-size:15px;font-weight:700;margin-bottom:4px}
.qh{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.crops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.crop{position:relative;min-height:96px;border-radius:16px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;padding:8px 4px;text-align:center;line-height:1.15}
.crop[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--green)}
.crop .chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center}
.crop[aria-pressed="true"] .chk{display:grid}
.ill{display:inline-grid;place-items:center;border-radius:50%;flex:none;overflow:hidden}

/* Parcels carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -22px;padding-left:22px;padding-right:22px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.pcard{flex:none;width:86%;scroll-snap-align:center;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:box-shadow .2s,border-color .2s}
.pcard.cur{border-color:var(--green);box-shadow:0 8px 24px rgba(47,93,58,.15)}
.pcard .band{height:84px;position:relative;display:flex;align-items:flex-end;gap:6px;padding:10px 14px}
.pcard .band .ill{box-shadow:0 2px 8px rgba(0,0,0,.15);border:2px solid #fff}
.pcard .piso{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.pcard .bd{padding:12px 14px 14px}
.pcard .nm{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:600;line-height:1.15}
.pcard .meta{font-size:13px;color:var(--muted);margin:2px 0 10px}
.pcard .al{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:8px 10px;border-radius:12px}
.dots{display:flex;justify-content:center;gap:6px;margin:2px 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:#D8D0BF;transition:width .2s,background .2s}
.dots i.on{width:20px;border-radius:4px;background:var(--green)}
.add-card{flex:none;width:60%;scroll-snap-align:center;border:2px dashed #CFC6B4;border-radius:22px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--green);font-weight:700;cursor:pointer;min-height:200px}
.add-card .plus{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.empty{text-align:center;padding:10px 4px 6px}
.empty .art{margin:6px auto 14px;width:150px}

/* Parcel detail */
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#EEE8DB;padding:4px;border-radius:14px;margin:4px 0 16px;position:sticky;top:-22px;z-index:3}
.ptabs button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.ptabs button[aria-pressed="true"]{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.phead{display:flex;align-items:center;gap:10px}
.phead .nav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.phead .nav:disabled{opacity:.35;cursor:default}
.phead .t{flex:1;min-width:0}
.alt-card{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:stretch}
.alt-bar{position:relative;border-radius:14px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr 1.2fr;min-height:170px}
.alt-bar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);letter-spacing:.02em}
.alt-bar .me{position:absolute;left:-2px;right:-2px;height:4px;background:#fff;box-shadow:0 0 0 2px var(--terra);border-radius:2px}
.alt-bar .me::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;background:var(--terra);border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv .k{font-size:12px;color:var(--muted);font-weight:600}
.kv .v{font-size:19px;font-weight:700;margin-top:2px}
.now-crops{display:flex;flex-direction:column;gap:8px}
.ncrop{display:flex;align-items:center;gap:12px}
.ncrop .nm{flex:1;font-weight:700;font-size:15px}
.ncrop .nm small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.lvl{display:inline-flex;align-items:center;gap:2px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.lvl svg{flex:none}
.lvl3{background:var(--green-soft);color:var(--green)}.lvl2{background:var(--gold-soft);color:var(--gold-ink)}.lvl1{background:var(--terra-soft);color:#8A3418}
.chart{width:100%;height:auto;display:block}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:600;color:var(--muted);margin-top:8px}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.fact{background:#F6F2E9;border-radius:12px;padding:10px}
.fact .k{font-size:11px;font-weight:700;color:var(--muted)}
.fact .v{font-size:16px;font-weight:700;margin-top:2px}
details{border-top:1px solid var(--line);padding-top:6px;margin-top:10px}
summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--green);list-style:none;display:flex;align-items:center;gap:8px;min-height:36px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin:0 2px}
details[open] summary::before{transform:rotate(45deg)}
details .body{padding-top:4px;font-size:14px;line-height:1.55;color:#3A443C}

/* Recommendation */
.reco{border:2px solid var(--green);padding:18px}
.reco .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.reco-name{font-family:Fraunces,Georgia,serif;font-size:25px;font-weight:600;line-height:1.1;margin:6px 0 2px}
.years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.yr{border-radius:16px;padding:10px 8px 12px;text-align:center;position:relative;transition:transform .3s,box-shadow .3s}
.yr.now{transform:translateY(-3px);box-shadow:0 0 0 2px var(--green),0 8px 18px rgba(47,93,58,.18)}
.yr .yl{font-size:11px;font-weight:700;opacity:.8;margin-bottom:6px}
.yr .yn{font-size:14px;font-weight:700;margin-top:6px;line-height:1.15}
.yr .yw{font-size:12px;line-height:1.35;margin-top:6px;color:#3A443C}
.reasons{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.reasons li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.reasons .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.phen{display:grid;grid-template-columns:62px repeat(12,minmax(0,1fr));gap:3px;align-items:center}
.phen .mh{text-align:center;font-size:10px;font-weight:700;color:var(--muted)}
.phen .rl{font-size:11px;font-weight:700;color:var(--muted);line-height:1.1}
.phen .c{height:24px;border-radius:5px;position:relative}
.phen .c b{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--green-soft);color:var(--green);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;font-weight:600;margin-top:12px}
.tip.warn{background:var(--gold-soft);color:var(--gold-ink)}
.review{background:var(--terra-soft);border-radius:14px;padding:12px 14px;color:#5C2810;font-size:14px;line-height:1.5;margin-bottom:12px}

/* Alerts + SMS */
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--line);background:#fff;text-align:left;width:100%}
.alert .ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.alert b{display:block;font-size:15px;margin-bottom:2px}
.alert .tx{font-size:13px;color:var(--muted);line-height:1.45;display:block}
.alert .when{font-size:11px;font-weight:700;color:var(--terra);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;display:block}
.alert.frost .ai{background:var(--violet-soft);color:var(--violet)}
.alert.rain .ai{background:var(--sky-soft);color:var(--sky)}
.alert.dry .ai{background:var(--gold-soft);color:var(--gold-ink)}
.alert.task .ai{background:var(--green-soft);color:var(--green)}
.phone{width:250px;margin:4px auto 14px;border-radius:34px;background:#1b1f1c;padding:12px 10px 18px;box-shadow:0 14px 30px rgba(0,0,0,.22)}

::selection{background:var(--green-soft);color:var(--ink)}

.brand{gap:10px;transition:transform .2s var(--ease)}
.brand:hover{transform:translateY(-1px)}
.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--green-2),var(--green));box-shadow:var(--sh-green)}
.flowsteps .s{transition:background .25s var(--ease),color .25s var(--ease)}
.flowsteps .s.on{background:linear-gradient(145deg,var(--green-2),var(--green));box-shadow:var(--sh-green)}
.flowsteps .n{transition:background .25s}
.flowsteps .sep{border-radius:2px;background:linear-gradient(90deg,var(--line),var(--green-soft))}
.user-chip{padding:4px 12px 4px 4px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-1)}
.user-chip .av{width:30px;height:30px;background:var(--green-soft);color:var(--green)}
.sms-dot{border-radius:999px;box-shadow:inset 0 0 0 1px rgba(31,122,77,.18)}

/* Mapa y superposiciones */
.stage{background:linear-gradient(160deg,#CFE0E6,#E4EADF)}
.pill{border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.88);box-shadow:var(--sh-2);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
.pill.dark{background:rgba(24,35,46,.88);border-color:rgba(255,255,255,.12)}
.legend{border-radius:var(--r-md);background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh-2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.legend .row i{border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.town-marker{background:rgba(24,35,46,.9);box-shadow:var(--sh-2)}
.pilot-label{background:rgba(255,255,255,.92);color:var(--green);font:700 12px Inter,system-ui,sans-serif;padding:5px 10px;border-radius:999px;box-shadow:var(--sh-2);white-space:nowrap;pointer-events:none}
.parcel-marker{transition:transform .2s var(--ease),box-shadow .2s;box-shadow:0 4px 14px rgba(24,35,46,.28)}
.parcel-marker:hover{transform:translateY(-2px) scale(1.03)}
.parcel-marker.sel{box-shadow:0 6px 18px rgba(200,54,27,.4)}
.maplibregl-ctrl-group{border-radius:14px!important;border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh-2)!important;overflow:hidden}
.ov-draw .btn{box-shadow:var(--sh-2)}

/* Panel */
.panel{background:linear-gradient(180deg,#F6F8F7,var(--cream) 220px);border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(24,35,46,.05);scrollbar-width:thin;scrollbar-color:#C3CCC6 transparent}
.panel-inner{animation:fadeUp .4s var(--ease)}
h1.title{font-size:28px;letter-spacing:-.02em}
h2.sec{font-size:17px;letter-spacing:-.01em}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--green);background:var(--green-soft);padding:4px 10px;border-radius:999px}
.cta-bar{padding:18px 22px 20px;background:linear-gradient(rgba(241,244,242,0),var(--cream) 36%)}

/* Tarjetas */
.card,.acard,.altc,.how3 div,.pcard{border:1px solid rgba(220,226,222,.9);box-shadow:var(--sh-1);border-radius:var(--r-md)}
.card{padding:18px;transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.card h3{letter-spacing:-.01em}
.acard{padding:18px;border-left-width:5px}
.acard.frost{border-left-color:var(--violet)}.acard.rain{border-left-color:var(--sky)}.acard.dry{border-left-color:#E8B33A}
.acard .at{letter-spacing:-.01em}
.aff{background:linear-gradient(180deg,#F7F9F8,#F1F4F2);border:1px solid var(--line);border-radius:var(--r-sm)}
.alert{border-radius:var(--r-md);box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.alert:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.anom{border-radius:var(--r-md);background:linear-gradient(135deg,#FFF6DB,#FFEFC2);box-shadow:var(--sh-1)}
.tip{border-radius:var(--r-md)}
.review{border-radius:var(--r-md)}
.evalc{border-radius:var(--r-lg)}
.reco{border-radius:var(--r-lg);box-shadow:var(--sh-2);background:linear-gradient(180deg,#fff,#FAFCFB)}

/* Etiquetas */
.tag{border-radius:999px;padding:4px 10px;font-size:13px}
.lvl{border-radius:999px}
.sev{border-radius:999px;padding:3px 10px}

/* Botones */
.btn{border-radius:14px;transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .2s,border-color .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:linear-gradient(145deg,var(--green-2),var(--green));box-shadow:var(--sh-green)}
.btn-primary:hover{background:linear-gradient(145deg,#2C8F5C,#18643F);box-shadow:0 10px 24px rgba(31,122,77,.34)}
.btn-primary:disabled{background:#D5DCD7;color:#6B7570;box-shadow:none;transform:none}
.btn-ghost{box-shadow:var(--sh-1)}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}
.btn-dark{background:linear-gradient(145deg,#26333F,var(--ink));box-shadow:0 6px 16px rgba(24,35,46,.28)}
.btn-danger:hover{background:var(--terra-soft)}
.link-btn{text-decoration-thickness:2px;text-underline-offset:4px;transition:color .2s}
.link-btn:hover{color:var(--green-2)}
.back{transition:color .2s,transform .2s var(--ease)}
.back:hover{color:var(--ink);transform:translateX(-2px)}
.listen{box-shadow:var(--sh-1);transition:transform .2s var(--ease),background .2s}
.listen:hover{transform:translateY(-1px)}

/* Opciones, cultivos y controles */
.option{border-radius:var(--r-md);box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.option:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--green)}
.crop{border-radius:var(--r-md);box-shadow:var(--sh-1);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s,background .18s}
.crop:hover{transform:translateY(-2px);border-color:#9CCBB1}
.crop[aria-pressed="true"]{background:linear-gradient(180deg,#EAF6EF,var(--green-soft));box-shadow:inset 0 0 0 2px var(--green),var(--sh-1)}
.crop .chk{box-shadow:0 2px 6px rgba(31,122,77,.4)}
.input{border-radius:var(--r-sm);border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(24,35,46,.04);transition:border-color .2s,box-shadow .2s}
.input:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 4px rgba(31,122,77,.16)}
.seg{border-radius:14px;background:#E6EBE8;box-shadow:inset 0 1px 2px rgba(24,35,46,.06)}
.seg button{border-radius:11px;transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--green);box-shadow:var(--sh-1)}
.months button{border-radius:var(--r-sm);box-shadow:var(--sh-1);transition:transform .15s var(--ease),background .2s}
.months button:hover{transform:translateY(-1px)}
.months button[aria-pressed="true"]{background:linear-gradient(145deg,var(--green-2),var(--green));box-shadow:var(--sh-green)}
.switch span{background:#CBD3CE}
.switch input:checked + span{background:linear-gradient(145deg,var(--green-2),var(--green))}
.switch span::after{box-shadow:0 1px 3px rgba(0,0,0,.25)}
.iconx{border-radius:var(--r-sm);transition:background .2s}
.iconx:hover{background:var(--terra-soft)}

/* Pestañas */
.ptabs{background:rgba(241,244,242,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ptabs button{position:relative;transition:color .2s}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-pressed="true"]{font-weight:700;border-bottom-color:var(--green)}

/* Parcelas */
.pcard{border-radius:var(--r-lg);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.pcard.cur{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 12px 30px rgba(31,122,77,.18)}
.pcard .band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 40%,rgba(24,35,46,.18));pointer-events:none}
.pcard .band>*{position:relative;z-index:1}
.pcard .piso{border-radius:999px;box-shadow:var(--sh-1);z-index:1}
.pcard .nm{font-size:22px;letter-spacing:-.02em}
.pcard .al{border-radius:var(--r-sm)}
.add-card{border-radius:var(--r-lg);border:2px dashed #B9C7BE;background:rgba(255,255,255,.5);transition:background .2s,border-color .2s,transform .2s var(--ease)}
.add-card:hover{background:#fff;border-color:var(--green);transform:translateY(-2px)}
.add-card .plus{box-shadow:var(--sh-green)}
.dots i{background:#CBD3CE}
.dots i.on{background:linear-gradient(90deg,var(--green-2),var(--green))}
.cnav{box-shadow:var(--sh-2);transition:opacity .2s,transform .2s var(--ease)}
.cnav:hover{transform:scale(1.06)}
.phead .nav{border-radius:var(--r-sm);box-shadow:var(--sh-1);transition:transform .15s,border-color .2s}
.phead .nav:not(:disabled):hover{border-color:var(--green);transform:translateY(-1px)}
.profile{border-radius:var(--r-md);box-shadow:var(--sh-1)}
.alt-bar{border-radius:var(--r-md);box-shadow:var(--sh-1)}
.fact{background:linear-gradient(180deg,#F7F9F8,#F1F4F2);border:1px solid var(--line);border-radius:var(--r-sm)}
.yr{border-radius:var(--r-md)}
.camp{border-radius:var(--r-md);background:#F4F6F5}
.cmpbars i{background:linear-gradient(90deg,#8DBEDC,var(--sky))}
.sseg{border-radius:8px}
.smark b{border-radius:999px}
details{border-top-color:var(--line)}
summary{transition:color .2s}
summary:hover{color:var(--green-2)}

/* Teléfono SMS */
.phone{border-radius:36px;background:linear-gradient(160deg,#26333F,#121A22);box-shadow:0 18px 40px rgba(24,35,46,.28),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone .scr{border-radius:26px}
.sms{border-radius:18px 18px 18px 5px;box-shadow:var(--sh-1)}

/* Carga y avisos */
.spinner{border-width:4px;border-color:var(--green-soft);border-top-color:var(--green)}
.toast{border-radius:999px;background:rgba(24,35,46,.94);box-shadow:var(--sh-2);padding:12px 20px}
.steps-check .d{box-shadow:0 2px 6px rgba(31,122,77,.35)}

/* Móvil: hoja inferior */
@media (max-width:899px){
  header.top{padding:8px 12px}
  .panel{border-radius:26px 26px 0 0;margin-top:-22px;box-shadow:0 -12px 32px rgba(24,35,46,.14)}
  .panel-inner::before{width:44px;height:5px;background:#C3CCC6}
  h1.title{font-size:25px}
  .pcard:hover,.option:hover,.add-card:hover,.alert:hover{transform:none}
}
@media (prefers-reduced-motion:reduce){.btn:hover,.option:hover,.pcard:hover,.crop:hover,.alert:hover{transform:none}}

/* ===== v8: splash, logo, rotaciones y "Cómo funciona" ===== */
.brand-mark{background:none!important;padding:0;box-shadow:0 2px 6px rgba(3,70,26,.25);border-radius:10px;overflow:hidden}
.brand-mark svg{width:34px;height:34px;display:block}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;cursor:pointer;transition:opacity .45s ease;padding:24px}
.splash.out{opacity:0;pointer-events:none}
.splash .sp-main{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-6vh}
.splash svg{width:min(32vw,132px);height:auto;animation:spIn .7s cubic-bezier(.34,1.56,.64,1) both}
.splash .sp-name{margin-top:20px;font-size:34px;font-weight:700;letter-spacing:-.3px;color:var(--ink);animation:spUp .5s .25s ease both}
.splash .sp-tag{margin-top:6px;font-size:16px;line-height:1.4;color:var(--muted);max-width:min(86vw,340px);animation:spUp .5s .35s ease both}
.splash .sp-by{position:absolute;left:0;right:0;bottom:max(32px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;animation:spUp .5s .5s ease both}
.splash .sp-by img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 2px 8px rgba(18,12,48,.25)}
.splash .sp-by span{font-size:12px;color:var(--muted);letter-spacing:.4px;line-height:1.25;text-align:left}
.splash .sp-by b{display:block;font-size:14px;color:#2A1F5C;letter-spacing:2.5px}
@keyframes spIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important}}

/* Tour corto para dibujar la parcela */
.coach{position:fixed;inset:0;z-index:60;pointer-events:none}
.coach-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 200vmax rgba(12,20,16,.64);transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease;pointer-events:none}
.coach-hole::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid rgba(255,255,255,.9);animation:coachRing 1.6s ease-out infinite}
.coach-hand{position:fixed;font-size:42px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));transform:translate(-30%,-8%);pointer-events:none}
.coach-hand.s1{animation:coachTap 3.6s ease-in-out infinite}
.coach-hand.s2{animation:coachBob 1.1s ease-in-out infinite}
.coach-bub{position:fixed;pointer-events:auto;background:#fff;border-radius:18px;padding:14px 16px 10px;width:min(320px,calc(100vw - 32px));box-shadow:0 12px 36px rgba(0,0,0,.3);animation:spUp .3s ease both}
.coach-bub .cs{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.4px}
.coach-bub .ct{margin:4px 0 2px;font-size:17px;font-weight:700;line-height:1.35;color:var(--ink)}
.coach-bub .cd{margin:0;font-size:15px;line-height:1.4;color:var(--muted)}
.coach-bub .cr{display:flex;justify-content:space-between;align-items:center;margin-top:8px;min-height:40px}
.coach-bub .cr .btn{min-height:40px;padding:0 16px;width:auto;font-size:15px}
@keyframes coachTap{0%,8%{left:var(--x1);top:var(--y1);transform:translate(-30%,-8%) scale(1)}12%{transform:translate(-30%,-8%) scale(.85)}16%,36%{left:var(--x1);top:var(--y1);transform:translate(-30%,-8%) scale(1)}46%{left:var(--x2);top:var(--y2);transform:translate(-30%,-8%) scale(1)}50%{transform:translate(-30%,-8%) scale(.85)}54%,70%{left:var(--x2);top:var(--y2);transform:translate(-30%,-8%) scale(1)}80%{left:var(--x3);top:var(--y3);transform:translate(-30%,-8%) scale(1)}84%{transform:translate(-30%,-8%) scale(.85)}88%,100%{left:var(--x3);top:var(--y3);transform:translate(-30%,-8%) scale(1)}}
@keyframes coachBob{0%,100%{transform:translate(-30%,-8%)}50%{transform:translate(-30%,6px)}}
@keyframes coachRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.coach-hand,.coach-hole::after{animation:none!important}}

/* Rotaciones */
.prios{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.prio{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);box-shadow:var(--sh-1)}
.prio[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.prio svg{width:18px;height:18px}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.cmp th{font-size:12.5px;font-weight:700;text-align:center;padding:0 2px 8px;vertical-align:bottom;line-height:1.25}
.cmp th:first-child{text-align:left}
.cmp td{padding:8px 2px;border-top:1px solid #EEF1EF;text-align:center}
.cmp td:first-child{text-align:left;font-weight:600;color:#3A443C}
.cmp tr.pri td:first-child{color:var(--green)}
.cmp tr.pri td:first-child::after{content:" ★";color:#E8A317}
.cmp tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.cmp .best{background:linear-gradient(180deg,#EAF6EF,#F4FAF6)}
.cmp th.best{border-radius:12px 12px 0 0}
.dots3{display:inline-flex;gap:3px}.dots3 i{width:9px;height:9px;border-radius:50%;background:#DCE3DE}
.dots3.l3 i{background:var(--green)}.dots3.l2 i:nth-child(-n+2){background:#E8A317}.dots3.l1 i:first-child{background:#D9644A}
.rcard{background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh-1)}
.rcard.best{border-color:var(--green)}
.rcard .rh{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.rcard .rl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.rcard h3{margin:2px 0 4px;font-size:19px}
.rcard .why{font-size:14.5px;line-height:1.5;color:#3A443C;margin:4px 0 12px}
.badge-best{flex:none;display:inline-flex;align-items:center;gap:4px;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.rseq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.rseq div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:#F4F6F5;border-radius:12px;padding:8px 4px;font-size:13px;font-weight:700;line-height:1.2}
.rseq small{font-weight:400;color:var(--muted);font-size:11.5px}
.tl{width:100%;height:auto;display:block;margin:4px 0 2px}
.tl-lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-bottom:8px}
.tl-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 4px}
.rk div{background:#F7F9F8;border:1px solid #EEF1EF;border-radius:10px;padding:8px;font-size:12px;color:var(--muted);font-weight:600;line-height:1.3}
.rk b{display:block;font-size:15px;color:var(--ink)}
.rdet{margin-top:8px}
.rdet h4{margin:12px 0 6px;font-size:14px}
.rdet ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.rdet li{margin-bottom:3px}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sky-soft);color:#1F5576}
.chosen{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:700;font-size:14px}
/* Cómo funciona */
.dtab{width:100%;border-collapse:collapse;font-size:13.5px}
.dtab td{padding:9px 4px;border-top:1px solid #EEF1EF;vertical-align:top;line-height:1.4}
.dtab td:first-child{font-weight:700;width:34%}
.dtab small{display:block;color:var(--muted);font-weight:400}
.src-live{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px;background:var(--green-soft);color:var(--green)}
.src-live.no{background:var(--gold-soft);color:var(--gold-ink)}
@media (max-width:420px){.camp{grid-template-columns:44px minmax(0,1fr);gap:6px 10px}.camp .cl{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}.camp .cl small{display:inline}}
.gloss dt{font-weight:700;margin-top:10px;font-size:15px}.gloss dd{margin:2px 0 0;color:#3A443C;font-size:14px;line-height:1.5}
.scale{display:flex;align-items:flex-end;gap:10px;margin:8px 0 4px}
.scale div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;flex:1}
.scale i{display:block;border-radius:3px;background:var(--sky);opacity:.8}
.soilk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
</style>
</head>

<div class="splash" id="splash" role="img" aria-label="Yachiraq, rotaciones que cuidan tu suelo y tu agua. Creado por NOVAQ">

      <radialGradient id="spBg" cx="50%" cy="46%" r="72%"><stop offset="0" stop-color="#033F17"/><stop offset=".42" stop-color="#077A28"/><stop offset=".78" stop-color="#13B61D"/><stop offset="1" stop-color="#58E31B"/></radialGradient>
      <linearGradient id="spLf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D2FF2F"/><stop offset=".5" stop-color="#63DB1C"/><stop offset="1" stop-color="#14A21C"/></linearGradient>
      <linearGradient id="spSt" gradientUnits="userSpaceOnUse" x1="0" y1="52" x2="0" y2="81"><stop offset="0" stop-color="#B9F92A"/><stop offset="1" stop-color="#36C51E"/></linearGradient>
    </defs>

const PILOT_KM=12;
const distKm=(lng,lat)=>Math.hypot((lng-TOWN.lng)*111.32*Math.cos(TOWN.lat*Math.PI/180),(lat-TOWN.lat)*110.574);
const inPilot=poly=>{const [x,y]=poly.reduce((a,p)=>[a[0]+p[0]/poly.length,a[1]+p[1]/poly.length],[0,0]);return distKm(x,y)<=PILOT_KM;};
function pilotRing(){const r=[];for(let i=0;i<=72;i++){const a=i/72*2*Math.PI;r.push([TOWN.lng+PILOT_KM*Math.cos(a)/(111.32*Math.cos(TOWN.lat*Math.PI/180)),TOWN.lat+PILOT_KM*Math.sin(a)/110.574]);}return r;}

const CLIM={live:false,refElev:TOWN.alt,
  tmin:[5.5,5.6,5.3,3.8,1.2,-0.8,-1.3,-0.3,1.8,3.5,4.3,5.0],
  tmax:[17.5,17.0,17.0,17.8,18.4,18.2,18.1,19.2,19.8,20.3,20.4,19.0],
  rain:[130,140,115,45,12,5,6,12,25,48,62,98],
  rh:[78,80,79,72,60,54,52,52,56,60,64,72]};
const CLIM_REF={tmin:CLIM.tmin.slice(),tmax:CLIM.tmax.slice()};
async function loadPower(){
  const url=`https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=T2M_MIN,T2M_MAX,PRECTOTCORR,RH2M&community=AG&longitude=${TOWN.lng}&latitude=${TOWN.lat}&format=JSON`;
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to); if(!r.ok)throw 0;
    const j=await r.json(), p=j.properties.parameter, K=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const arr=n=>K.map(k=>+p[n][k]);
    const tmin=arr('T2M_MIN'),tmax=arr('T2M_MAX'),pr=arr('PRECTOTCORR'),rh=arr('RH2M');
    if(tmin.some(v=>isNaN(v)||v<-90))throw 0;
    const el=j.geometry&&j.geometry.coordinates&&j.geometry.coordinates[2],pe=(el&&el>500)?el:TOWN.alt;
    /* Corrección de sesgo (fusión satélite + referencia local): el cuadro de ~50 km de POWER en los Andes suele marcar
       noches más frías y días más cálidos que en el valle. Ajustamos el promedio anual a la referencia local, a la misma altura,
       y conservamos el patrón mensual de POWER. */
    const avg=a=>a.reduce((x,y)=>x+y,0)/a.length,dz=-0.0065*(pe-TOWN.alt);
    const bMin=avg(CLIM_REF.tmin)+dz-avg(tmin),bMax=avg(CLIM_REF.tmax)+dz-avg(tmax);
    CLIM.tmin=tmin.map(v=>+(v+bMin).toFixed(1)); CLIM.tmax=tmax.map(v=>+(v+bMax).toFixed(1)); CLIM.bias={min:+bMin.toFixed(1),max:+bMax.toFixed(1),elev:Math.round(pe)};
    CLIM.rh=rh.map(Math.round); CLIM.rain=pr.map((v,i)=>Math.round(v*DAYS[i])); CLIM.refElev=pe; CLIM.live=true;
    rerenderIfClimate();
  }catch(e){ /* sin conexión o sin permiso: valores de referencia */ }
}
function erf(x){const t=1/(1+0.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return x>=0?y:-y;}
function climFor(alt){
  const d=-0.0065*(alt-CLIM.refElev);
  const tmin=CLIM.tmin.map(v=>+(v+d).toFixed(1)), tmax=CLIM.tmax.map(v=>+(v+d).toFixed(1));
  const frost=tmin.map((t,i)=>Math.round(DAYS[i]*0.5*(1+erf((0-t)/(2.8*Math.SQRT2)))));
  return {tmin,tmax,frost,rain:CLIM.rain,rh:CLIM.rh};
}

/* ===== Geometry ===== */
const M_LAT=110574, M_LNG=lat=>111320*Math.cos(lat*Math.PI/180);
const off=(c,dx,dy)=>[c.lng+dx/M_LNG(c.lat),c.lat+dy/M_LAT];
function quadAt(lng,lat,w,h,rot){const c={lng,lat},r=rot*Math.PI/180;return [[-w/2,-h/2],[w/2,-h/2*0.82],[w/2*0.9,h/2],[-w/2,h/2*0.92]].map(([x,y])=>off(c,x*Math.cos(r)-y*Math.sin(r),x*Math.sin(r)+y*Math.cos(r)));}
function areaHa(poly){const lat0=poly[0][1];let s=0;for(let i=0;i<poly.length;i++){const [x1,y1]=poly[i],[x2,y2]=poly[(i+1)%poly.length];s+=(x1*M_LNG(lat0))*(y2*M_LAT)-(x2*M_LNG(lat0))*(y1*M_LAT);}return Math.abs(s)/2/10000;}
const centroid=poly=>{let x=0,y=0;poly.forEach(p=>{x+=p[0];y+=p[1];});return [x/poly.length,y/poly.length];};
function inPoly(pt,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function bbox(polys){let a=[180,90,-180,-90];polys.forEach(p=>p.forEach(([x,y])=>{a[0]=Math.min(a[0],x);a[1]=Math.min(a[1],y);a[2]=Math.max(a[2],x);a[3]=Math.max(a[3],y);}));return [[a[0],a[1]],[a[2],a[3]]];}
const fmtHa=v=>v<0.1?(v*10000).toFixed(0)+' m²':v.toFixed(2)+' ha';
const fmtM=v=>Math.round(v).toLocaleString('es-PE')+' m';

/* ===== Elevation from SRTM terrain tiles ===== */
const DEM_URL='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
const tiles={};
function tileXY(lng,lat,z){const n=2**z,x=(lng+180)/360*n,r=lat*Math.PI/180,y=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n;return {x,y};}
function loadTile(z,x,y){const k=z+'/'+x+'/'+y;if(tiles[k])return tiles[k];
  tiles[k]=new Promise((res,rej)=>{const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.drawImage(img,0,0);res(g.getImageData(0,0,256,256).data);}catch(e){rej(e);}};
    img.onerror=rej;img.src=DEM_URL.replace('{z}',z).replace('{x}',x).replace('{y}',y);setTimeout(()=>rej(new Error('timeout')),8000);});
  tiles[k].catch(()=>{delete tiles[k];});return tiles[k];}
async function elev(lng,lat,z=14){const t=tileXY(lng,lat,z),tx=Math.floor(t.x),ty=Math.floor(t.y);const d=await loadTile(z,tx,ty);const px=Math.min(255,Math.floor((t.x-tx)*256)),py=Math.min(255,Math.floor((t.y-ty)*256)),i=(py*256+px)*4;return d[i]*256+d[i+1]+d[i+2]/256-32768;}
const ASPECT=['el este','el noreste','el norte','el noroeste','el oeste','el suroeste','el sur','el sureste'];
async function analyze(poly,fallbackAlt){
  const area=areaHa(poly),[cx,cy]=centroid(poly);
  try{
    const bb=bbox([poly]),pts=[];
    for(let a=0;a<7;a++)for(let b=0;b<7;b++){const p=[bb[0][0]+(bb[1][0]-bb[0][0])*(a+.5)/7,bb[0][1]+(bb[1][1]-bb[0][1])*(b+.5)/7];if(inPoly(p,poly))pts.push(p);}
    pts.push([cx,cy]);
    const zs=await Promise.all(pts.map(p=>elev(p[0],p[1])));
    const X=pts.map(p=>(p[0]-cx)*M_LNG(cy)),Y=pts.map(p=>(p[1]-cy)*M_LAT);
    const n=pts.length,mz=zs.reduce((a,b)=>a+b,0)/n;let sxx=0,sxy=0,syy=0,sxz=0,syz=0;
    for(let i=0;i<n;i++){const z=zs[i]-mz;sxx+=X[i]*X[i];sxy+=X[i]*Y[i];syy+=Y[i]*Y[i];sxz+=X[i]*z;syz+=Y[i]*z;}
    const det=sxx*syy-sxy*sxy,a=det?(sxz*syy-syz*sxy)/det:0,b=det?(syz*sxx-sxz*sxy)/det:0;
    const slope=Math.max(1,Math.round(Math.hypot(a,b)*100)),ang=Math.atan2(-b,-a);
    return {area,alt:Math.round(mz),slope,aspect:ASPECT[((Math.round(ang/(Math.PI/4))%8)+8)%8],real:true};
  }catch(e){return {area,alt:fallbackAlt||3520,slope:12,aspect:'el noreste',real:false};}
}

    const v={};j.properties.layers.forEach(L=>{const f=(L.unit_measure&&L.unit_measure.d_factor)||10,xs=L.depths.map(d=>d.values.mean).filter(x=>x!=null);if(xs.length)v[L.name]=xs.reduce((a,b)=>a+b,0)/xs.length/f;});

/* Verdor de la vegetación: MODIS NDVI (NASA, 250 m, cada 16 días) vs. la misma fecha de los 3 años anteriores */
const NDVI={},NDVI_REF={live:false,pct:-9,cur:0.41,date:''};
/* La API de MODIS es lenta (15-30 s por consulta): máximo 3 consultas a la vez */
let mQ=0;const mWait=[];
async function modisGet(url){while(mQ>=3)await new Promise(r=>mWait.push(r));mQ++;try{return await getJSON(url,40000,{Accept:'application/json'});}finally{mQ--;const n=mWait.shift();if(n)n();}}
async function loadNdvi(p){
  if(NDVI[p.id])return;NDVI[p.id]=Object.assign({loading:true},NDVI_REF);
  const [lng,lat]=centroid(p.poly),B='https://modis.ornl.gov/rst/api/v1/MOD13Q1/',H={Accept:'application/json'},q=`latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}`;
  /* MOD13Q1 sale cada 16 días (día del año 1, 17, 33…) y se publica con ~3 semanas de retraso: calculamos la última fecha
     sin pedir la lista de fechas (esa consulta es lenta). Si aún no está, probamos la anterior. */
  const doyOf=d=>Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  const comp=back=>{let y=NY,d=Math.floor((doyOf(NOW)-24-1)/16)*16+1-16*back;while(d<1){y--;d+=368;}return {y,doy:String(d).padStart(3,'0')};};
  const val=async(yy,doy)=>{const j=await modisGet(`${B}subset?${q}&band=250m_16_days_NDVI&startDate=A${yy}${doy}&endDate=A${yy}${doy}&kmAboveBelow=0&kmLeftRight=0`);const d=j.subset&&j.subset[0]&&j.subset[0].data[0];return d!=null&&d>-2000?d*0.0001:null;};
  try{let c=comp(0),cur=await val(c.y,c.doy).catch(()=>null);if(cur==null){c=comp(1);cur=await val(c.y,c.doy);}
    if(cur==null)throw 0;
    const past=(await Promise.all([1,2,3].map(k=>val(c.y-k,c.doy).catch(()=>null)))).filter(v=>v!=null);if(!past.length)throw 0;
    const mean=past.reduce((a,b)=>a+b,0)/past.length,dt=new Date(c.y,0,+c.doy);
    NDVI[p.id]={live:true,cur:+cur.toFixed(2),mean:+mean.toFixed(2),pct:Math.round((cur/mean-1)*100),date:`${dt.getDate()} ${MONTHS[dt.getMonth()].toLowerCase()} ${c.y}`};rerenderIfClimate();
  }catch(e){NDVI[p.id]=Object.assign({},NDVI_REF);}
}
const ndviOf=p=>NDVI[p.id]||NDVI_REF;

const STAGES=['Brotando','Creciendo','Floreciendo','Madurando','Lista para cosechar'];
function mainKey(p){const c=(p.crops||[]).filter(x=>x!=='Descanso');if(c.includes('Maíz')&&c.includes('Haba'))return 'Maíz con haba';if(c.includes('Avena')&&c.includes('Haba'))return 'Avena + vicia';return c.find(x=>CI[x])||null;}
function stageOf(p){
  const key=mainKey(p);if(!key||p.sownI==null)return null;
  const info=CI[key],el=Math.max(0,nowI-p.sownI),frac=el/info.dur;
  const idx=frac<.2?0:frac<.45?1:frac<.7?2:frac<1?3:4;

}

/* ===== Next sowing: evaluate the farmer's idea, from today ===== */
const PLAN_OPTS=['Papa','Papa nativa','Maíz','Maíz con haba','Haba','Tarwi','Quinua','Cebada','Avena + vicia','Oca'];
function earliestI(p){const st=stageOf(p);return st?Math.max(nowI,st.harvestI):nowI;}
function sowFrom(c,from){const w=CI[c].win;for(let i=from;i<from+24;i++)if(inWin(mOf(i),w))return i;return from;}
function windowEnd(c,i){let j=i;while(inWin(mOf(j+1),CI[c].win)&&j<i+6)j++;return j;}
function evalCrop(p,c,ctx){
  const info=CI[c];if(!info)return null;
  ctx=ctx||{};
  const piso=pisoOf(p.stats.alt),cl=climFor(p.stats.alt),suit=(SUIT[piso][c]!=null?SUIT[piso][c]:2);
  const from=ctx.from!=null?ctx.from:earliestI(p),sow=sowFrom(c,from),harvest=sow+info.dur,flower=sow+Math.round(info.dur*.55);
  const fN=cl.frost[mOf(flower)],hN=cl.frost[mOf(harvest-1)];
  let sc=0;const pros=[],cons=[];
  if(suit===1){sc-=3;cons.push({i:'mountain',t:`Sufre a ${fmtM(p.stats.alt)}: el piso ${PISOS[piso].name} es muy frío para este cultivo.`});}
  else if(suit===3){sc+=1;pros.push({i:'mountain',t:`Crece bien en el piso ${PISOS[piso].name}.`});}
  if(info.frost===1&&(fN>=5||hN>=5)){sc-=2;cons.push({i:'snow',t:`Florecería en ${MF[mOf(flower)]}, cuando hay unas ${Math.max(fN,hN)} noches de helada.`});}
  else if(info.frost===2&&fN>=8){sc-=1;cons.push({i:'snow',t:`Florecería en ${MF[mOf(flower)]} con heladas: siembra al inicio de la temporada.`});}
  else if(info.frost===3){sc+=1;pros.push({i:'snow',t:'Aguanta bien las heladas.'});}
  const before=(ctx.before||[...(p.crops||[]),...(p.prev||[])]).filter(x=>x!=='Descanso');
  const famOf=x=>(CI[x]||{}).fam, parts=c==='Maíz con haba'?['Maíz','Haba']:c==='Avena + vicia'?['Avena']:[c];
  if(parts.some(x=>before.includes(x))||before.includes(c)){sc-=2;cons.push({i:'bug',t:`Ya sembraste ${parts[0].toLowerCase()} hace poco: repetir cansa el suelo y trae plagas.`});}
  else if(famOf(c)==='tuber'&&before.some(x=>famOf(x)==='tuber')){sc-=1;cons.push({i:'bug',t:'Tubérculo después de tubérculo: más riesgo de gorgojo de los Andes.'});}
  if(info.legume&&!before.some(x=>(CI[x]||{}).legume||x==='Haba'||x==='Tarwi')){sc+=2;pros.push({i:'leaf',t:'Devuelve abono natural (nitrógeno) a tu suelo.'});}
  else if(!info.legume&&before.some(x=>(CI[x]||{}).legume||x==='Haba'||x==='Tarwi')){sc+=1;pros.push({i:'leaf',t:'Aprovecha el abono que dejó la leguminosa que sembraste antes.'});}
  if(ANOM.rainPct<=-20&&p.water!=='riego'){if(info.water===3){sc-=2;cons.push({i:'drop',t:`Necesita mucha agua y este mes llovió ${-ANOM.rainPct} % menos de lo normal.`});}else if(info.water===1){sc+=1;pros.push({i:'drop',t:'Necesita poca agua: buena opción si sigue seco.'});}}
  if(p.animals==='si'&&info.forage){sc+=1;pros.push({i:'cow',t:'Da forraje para tus animales.'});}
  if(p.purpose!=='casa'&&['Quinua','Papa','Haba','Tarwi','Papa nativa'].includes(c)){sc+=.5;pros.push({i:'coins',t:'Tiene mercado para vender.'});}
  const lvl=sc>=2||(sc>=1&&!cons.length)?3:sc>=0?2:1;
  return {c,info,lvl,sc,pros,cons,sow,harvest,flower,end:windowEnd(c,sow),from,canNow:sow===nowI};
}
function alternatives(p,exclude){return PLAN_OPTS.filter(c=>!exclude.includes(c)).map(c=>evalCrop(p,c)).filter(e=>e&&e.lvl>=2).sort((a,b)=>b.sc-a.sc||a.sow-b.sow).slice(0,3);}
function nextPlan(p){
  const mine=p.plan&&CI[p.plan]?evalCrop(p,p.plan):null;
  const alts=alternatives(p,p.plan?[p.plan]:[]);
  const next=mine&&mine.lvl>=2?mine:(alts[0]||mine);
  let after=null;
  if(next){const tmp=Object.assign({},p,{crops:[next.c],prev:p.crops});const cands=PLAN_OPTS.filter(c=>c!==next.c).map(c=>evalCrop(tmp,c,{from:next.harvest,before:[next.c,...(p.crops||[])]})).filter(Boolean).sort((a,b)=>b.sc-a.sc);after=cands[0]||null;}

const lvlHTML=n=>{const w=['','No recomendado','Con cuidado','Bien'][n];return `<span class="lvl lvl${n}">${[1,2,3].map(x=>`<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8M12 13C12 9 9 7 5 7c0 4 3 6 7 6zM12 13c0-3.5 2.5-6 7-6 0 3.5-2.5 6-7 6z" fill="${x<=n?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" opacity="${x<=n?1:.35}"/></svg>`).join('')}<span style="margin-left:4px">${w}</span></span>`;};

/* ===== Rotaciones: comparar 3 estrategias de 3 años (simulación mensual de 36 meses) =====
   Reglas transparentes (no caja negra). C: cuánto deja el suelo expuesto a la lluvia (1 = suelo desnudo,
   valores tipo factor C de la ecuación de erosión USLE). om: aporte de materia orgánica 0-2. inc: valor de venta 0-2.
   Referencias generales (FAO, INIA); deben validarse con técnicos de la zona. */
const TR={
  'Papa':{C:.55,om:0,inc:2},'Papa nativa':{C:.5,om:0,inc:2},'Oca':{C:.5,om:0,inc:1},
  'Maíz':{C:.45,om:1,inc:1},'Maíz con haba':{C:.4,om:1,inc:1},'Haba':{C:.4,om:1,inc:2},
  'Tarwi':{C:.4,om:1,inc:2,root:1},'Quinua':{C:.5,om:0,inc:2,root:1},'Cebada':{C:.25,om:1,inc:1},
  'Avena':{C:.2,om:1,inc:0},'Avena + vicia':{C:.15,om:2,inc:0},'Pastos':{C:.05,om:2,inc:0,root:1},'Descanso':{C:.3,om:1,inc:0}
};
const PRIOS=[['suelo','Cuidar el suelo','leaf'],['agua','Ahorrar agua','drop'],['ingreso','Vender más','coins'],['forraje','Forraje','cow'],['helada','Menos helada','snow']];
const CRIT=[['suelo','Abona el suelo'],['erosion','Protege de la erosión'],['agua','Pide poca agua'],['helada','Aguanta el frío'],['plagas','Corta plagas'],['ingreso','Para vender'],['forraje','Forraje']];
const famKey=c=>c==='Descanso'?'rest':(CI[c]||{}).fam;
function rotStrategies(p){
  const piso=pisoOf(p.stats.alt),legume=piso==='quechua'?'Haba':'Tarwi',tuber=piso==='quechua'?'Papa':'Papa nativa';
  const cur=mainKey(p),prev=(p.prev||[]).filter(c=>CI[c])[0]||null;
  const cyc=[prev,cur].filter(Boolean);if(!cyc.length)cyc.push(tuber);
  const now=[cyc[0],cyc[1%cyc.length],cyc[0]];
  let soil=piso==='puna'?['Avena + vicia',tuber,'Pastos']:[legume,tuber,'Avena + vicia'];
  let dry=piso==='puna'?['Pastos','Pastos','Avena + vicia']:['Quinua','Tarwi','Cebada'];
  const fix=s=>cur&&famKey(s[0])===famKey(cur)&&famKey(s[0])!=='pasture'?[s[1],s[2],s[0]]:s;
  return [
    {k:'hoy',name:'Seguir como ahora',seq:now,why:`Repite lo que ya siembras${cyc.length>1?` (${cyc.join(' y ').toLowerCase()})`:''}. Sirve para comparar.`},
    {k:'suelo',name:'Cuidar el suelo',seq:fix(soil),why:piso==='puna'?'Avena con vicia cubre el suelo y lo abona; la papa nativa aprovecha ese abono; los pastos dejan la tierra descansar cubierta.':`${legume==='Haba'?'La haba':'El tarwi'} devuelve abono natural (nitrógeno), la ${tuber.toLowerCase()} lo aprovecha y la avena con vicia cubre el suelo en los meses de lluvia.`},
    {k:'agua',name:'Menos agua, más venta',seq:fix(dry),why:piso==='puna'?'Pastos y forraje piden poca agua y aguantan la helada de la puna.':'Quinua y tarwi piden poca agua y se venden bien; la cebada aguanta helada y deja paja para los animales.'}
  ];
}
function simRotation(p,seq){
  const cl=climFor(p.stats.alt),start=earliestI(p),H=36,occ=new Array(H).fill(null),evs=[];
  let from=start,before=[...(p.crops||[]),...(p.prev||[])].filter(c=>c!=='Descanso');
  seq.forEach(c=>{
    if(c==='Descanso'){const s=from,e=from+12;for(let i=s;i<e;i++)if(i-start<H&&i>=start)occ[i-start]=c;evs.push({c,sow:s,harvest:e,pros:[],cons:[],info:{water:1,frost:3}});from=e;return;}
    const tmp=Object.assign({},p,{crops:[before[0]||'Descanso'],prev:before.slice(1)});
    const ev=evalCrop(tmp,c,{from,before});if(!ev)return;evs.push(ev);
    for(let i=ev.sow;i<ev.harvest;i++)if(i-start<H)occ[i-start]=c;
    from=ev.harvest;before=[c,...before];
  });
  const slopeF=Math.min(2.5,Math.max(.4,p.stats.slope/10));
  let E=0,R=0,bare=0,bareRain=0;
  occ.forEach((c,i)=>{const r=cl.rain[mOf(start+i)];R+=r;E+=r*(c?TR[c].C:1);if(!c){bare++;if(r>=60)bareRain++;}});
  const cov=E/R,eros=cov*slopeF;

  const cnt=(ic)=>evs.reduce((a,e)=>a+e.cons.filter(x=>x.i===ic).length,0);
  const water=seq.reduce((a,c)=>a+((CI[c]||{water:1}).water),0)/seq.length;
  const sc={

    erosion:Math.max(0,Math.min(1,(.6-cov)/.3)),
    agua:(3-water)/2,
    helada:Math.max(0,1-(cnt('snow')+cnt('mountain'))/2),
    plagas:Math.max(0,1-cnt('bug')/2),
    ingreso:seq.reduce((a,c)=>a+(TR[c]||{inc:0}).inc,0)/6,
    forraje:Math.min(1,seq.filter(c=>(CI[c]||{}).forage).length/2)
  };
  return {start,occ,evs,sc,eros,cov,erosLvl:eros<.35?'baja':eros<.7?'media':'alta',bare,bareRain,legumes};
}
function rotWeights(p){
  const pr=p.prio||[],w={suelo:1,erosion:1,agua:1,helada:1,plagas:1,ingreso:p.purpose==='casa'?.4:1,forraje:p.animals==='si'?1:0};
  if(p.water==='riego')w.agua=.5;
  if(socLvl(soilOf(p).soc)==='bajo')w.suelo*=1.5;
  if(p.stats.slope>=15)w.erosion*=1.5;
  pr.forEach(k=>{if(k==='suelo'){w.suelo+=1.5;w.erosion+=1;}else if(k==='forraje')w.forraje=Math.max(w.forraje,1)+1.5;else w[k]=(w[k]||1)+1.5;});
  return w;
}
function rotCompare(p){
  const w=rotWeights(p),list=rotStrategies(p).map(s=>{const r=simRotation(p,s.seq);let t=0,W=0;Object.keys(w).forEach(k=>{t+=r.sc[k]*w[k];W+=w[k];});return Object.assign(s,r,{total:W?t/W:0});});
  const best=list.reduce((a,b)=>b.total>a.total+.01?b:a);best.best=true;return {list,w};
}
const lvl3=v=>v>=.67?3:v>=.34?2:1;
const dots3=v=>{const l=lvl3(v);return `<span class="dots3 l${l}" title="${['','Bajo','Medio','Alto'][l]}"><i></i><i></i><i></i></span>`;};

      actions:acts,src:srcF,

  }

      what:'Un día de lluvia intensa.',affects:p.stats.slope>=12?`Tu parcela tiene ${p.stats.slope} % de pendiente: el agua puede llevarse la tierra.`:'Tu parcela es casi plana: revisa que el agua pueda salir.',
      actions:['Limpia zanjas y canales antes de ese día.',p.stats.slope>=12?'Abre o refuerza surcos en curva de nivel para frenar el agua.':'Abre una salida para que el agua no se empoce.','No dejes tierra recién removida sin cubrir.'],
      src:fc?'Pronóstico Open-Meteo + pendiente (SRTM)':'Pronóstico de ejemplo + pendiente (SRTM)',

      comm:noAcc(`YACHIRAQ: Aviso para la comunidad de Chiara. Lluvia fuerte el ${fmtDay(rainDate)}. Limpiemos juntos canales y zanjas comunales.`)});
  }

    A.push({k:'dry',icon:'drop',sev:'media',when:`Este mes (${MF[NM]})`,title:`Llovió ${-ANOM.rainPct} % menos de lo normal`,
      what:`Los satélites ven tu zona ${ANOM.soil} para ${MF[NM]}.`,
      affects:st?(st.info.water>=2?`Tu ${crop} necesita agua constante: cuida la humedad.`:`Tu ${crop} aguanta bien la falta de agua.`):'Buen momento para planear una siembra que necesite poca agua.',
      actions:[p.water==='riego'?'Riega temprano en la mañana, cuando se pierde menos agua.':'Cubre el suelo con paja o rastrojo para guardar la humedad.','Para tu próxima siembra, prefiere cultivos de poca agua: quinua, tarwi o cebada.','Revisa la pestaña Siembra: ya ajustamos las opciones a este año más seco.'],
      src:'GPM IMERG (lluvia) + SMAP (humedad del suelo)',
      sms:noAcc(`YACHIRAQ: Este mes llovio ${-ANOM.rainPct}% menos de lo normal en ${p.name}. Cubre el suelo con paja para guardar humedad.`),
      comm:noAcc(`YACHIRAQ: Aviso para la comunidad de Chiara. Este mes llovio ${-ANOM.rainPct}% menos de lo normal. Cuidemos el agua de riego.`)});
  }
  if(st&&st.idx>=3)A.push({k:'task',icon:'cal',sev:'baja',when:cap(fmtMY(st.harvestI)),title:`Cosecha de ${crop}`,what:'Se acerca el tiempo de cosecha.',affects:`Tu ${crop} está ${st.name.toLowerCase()}.`,actions:['Prepara sacos y espacio seco para guardar.','Si se anuncia helada, adelanta la cosecha.'],src:'Calendario de tu cultivo',sms:noAcc(`YACHIRAQ: Se acerca la cosecha de ${crop} en ${p.name}.`),comm:''});

}
const SEV={alta:{l:'Alerta alta',c:'#B42318',bg:'#FEE4E2'},media:{l:'Atención',c:'#8A5A00',bg:'#FFF1CC'},baja:{l:'Aviso',c:'#1F7A4D',bg:'#E1F1E7'}};

/* ===== Map ===== */
let map=null,mapReady=false,spin=null,townMarker=null,meMarker=null,pMarkers=[],vMarkers=[],mMarkers=[],yearTimer=null;
function initMap(){
  const fail=()=>$('#stage').classList.add('nomap');
  if(!window.maplibregl){fail();return;}
  try{
    map=new maplibregl.Map({container:'map',center:[TOWN.lng,TOWN.lat],zoom:12.2,pitch:66,bearing:-25,maxPitch:80,attributionControl:{compact:true},
      style:{version:8,
        sources:{
          sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:16,attribution:'Imagen © Esri, Maxar, Earthstar Geographics'},
          dem:{type:'raster-dem',tiles:[DEM_URL],encoding:'terrarium',tileSize:256,maxzoom:14,attribution:'Relieve: SRTM/NASADEM (NASA) vía AWS Terrain Tiles'},
          hs:{type:'raster-dem',tiles:[DEM_URL],encoding:'terrarium',tileSize:256,maxzoom:14}},
        layers:[{id:'sat',type:'raster',source:'sat'},{id:'hill',type:'hillshade',source:'hs',paint:{'hillshade-shadow-color':'#2b2418','hillshade-highlight-color':'#fff8e6','hillshade-exaggeration':0.2}}],
        terrain:{source:'dem',exaggeration:1.45}}});
    map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
    map.on('load',()=>{
      mapReady=true;
      try{if(map.setSky)map.setSky({'sky-color':'#A9CBE0','horizon-color':'#E9E3D3','fog-color':'#E9E3D3','sky-horizon-blend':0.6,'horizon-fog-blend':0.7,'fog-ground-blend':0.35});}catch(e){}
      const E={type:'FeatureCollection',features:[]};
      const ring=pilotRing(),W=1.6;
      map.addSource('pilot',{type:'geojson',data:{type:'FeatureCollection',features:[
        {type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[[[TOWN.lng-W,TOWN.lat-W],[TOWN.lng+W,TOWN.lat-W],[TOWN.lng+W,TOWN.lat+W],[TOWN.lng-W,TOWN.lat+W],[TOWN.lng-W,TOWN.lat-W]],ring.slice().reverse()]}},
        {type:'Feature',properties:{line:1},geometry:{type:'LineString',coordinates:ring}}]}});
      map.addLayer({id:'pilot-mask',type:'fill',source:'pilot',filter:['==','$type','Polygon'],paint:{'fill-color':'#18232E','fill-opacity':0.5}});
      map.addLayer({id:'pilot-line',type:'line',source:'pilot',filter:['==','$type','LineString'],paint:{'line-color':'#fff','line-width':2,'line-opacity':0.85,'line-dasharray':[3,2]}});
      const pl=document.createElement('div');pl.className='pilot-label';pl.textContent='Zona del piloto: Chiara (aprox.)';
      new maplibregl.Marker({element:pl,anchor:'top'}).setLngLat(ring[54]).addTo(map);
      map.addSource('parcels',{type:'geojson',data:E});map.addSource('draft',{type:'geojson',data:E});
      map.addLayer({id:'p-fill',type:'fill',source:'parcels',paint:{'fill-color':['get','color'],'fill-opacity':['get','op']}});
      map.addLayer({id:'p-halo',type:'line',source:'parcels',paint:{'line-color':'#fff','line-width':['case',['get','sel'],5,3]}});
      map.addLayer({id:'p-line',type:'line',source:'parcels',paint:{'line-color':['case',['get','sel'],'#C2522A','#2F5D3A'],'line-width':2.2}});
      map.addLayer({id:'d-fill',type:'fill',source:'draft',filter:['==','$type','Polygon'],paint:{'fill-color':'#C2522A','fill-opacity':0.18}});
      map.addLayer({id:'d-line',type:'line',source:'draft',paint:{'line-color':'#fff','line-width':3,'line-dasharray':[2,1.4]}});
      const el=document.createElement('div');el.className='town-marker';el.textContent='Chiara';
      townMarker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([TOWN.lng,TOWN.lat]).addTo(map);
      map.on('click',e=>{
        if(e.originalEvent&&e.originalEvent.target&&e.originalEvent.target.closest&&e.originalEvent.target.closest('.vtx,.mid,.parcel-marker'))return;
        if(S.screen==='draw'){S.draft.push([e.lngLat.lng,e.lngLat.lat]);S.selV=null;drawDraft(true);render();}
      });
      map.on('click','p-fill',e=>{if(['parcels','parcel'].includes(S.screen)&&e.features[0]){openParcel(e.features[0].properties.id);}});
      syncMap(true);
    });
    ['mousedown','touchstart','wheel'].forEach(ev=>map.on(ev,()=>{if(spin){clearInterval(spin);spin=null;}}));
    setTimeout(()=>{if(!mapReady)fail();},15000);
  }catch(e){fail();}
}
function fly(o){if(mapReady)map.flyTo(Object.assign({speed:0.9,curve:1.4,essential:true},o));}
function fitPolys(polys,o){if(!mapReady||!polys.length)return;const mob=innerWidth<900;map.fitBounds(bbox(polys),Object.assign({padding:mob?{top:70,bottom:70,left:50,right:50}:130,pitch:60,bearing:map.getBearing(),maxZoom:17,duration:2000},o||{}));}
function setParcelsLayer(onlyId,colorOverride){
  if(!mapReady)return;
  pMarkers.forEach(m=>m.remove());pMarkers=[];
  const list=S.parcels.filter(p=>!onlyId||p.id===onlyId);
  map.getSource('parcels').setData({type:'FeatureCollection',features:list.map(p=>({type:'Feature',properties:{id:p.id,sel:p.id===S.cur,color:colorOverride&&p.id===onlyId?colorOverride:PISOS[pisoOf(p.stats.alt)].col,op:colorOverride&&p.id===onlyId?0.7:0.42},geometry:{type:'Polygon',coordinates:[[...p.poly,p.poly[0]]]}}))});
  list.forEach(p=>{const el=document.createElement('div');el.className='parcel-marker'+(p.id===S.cur&&S.screen==='parcel'?' sel':'');el.id='pm-'+p.id;
    el.innerHTML=`<span class="pi" style="background:${PISOS[pisoOf(p.stats.alt)].col}">${icm('sprout',13)}</span><span class="pt">${p.name}</span>`;
    el.addEventListener('click',ev=>{ev.stopPropagation();openParcel(p.id);});
    pMarkers.push(new maplibregl.Marker({element:el,anchor:'bottom',offset:[0,-8]}).setLngLat(centroid(p.poly)).addTo(map));});
}
function clearHandles(){vMarkers.forEach(m=>m.remove());mMarkers.forEach(m=>m.remove());vMarkers=[];mMarkers=[];}
function drawDraft(rebuild){
  if(!mapReady)return;
  const d=S.draft,f=[];
  if(d.length>=3)f.push({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[[...d,d[0]]]}});
  else if(d.length===2)f.push({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:d}});
  map.getSource('draft').setData({type:'FeatureCollection',features:f});
  if(rebuild){
    clearHandles();
    d.forEach((pt,i)=>{const el=document.createElement('div');el.className='vtx'+(S.selV===i?' sel':'');el.setAttribute('aria-label','Punto '+(i+1));
      const m=new maplibregl.Marker({element:el,draggable:true}).setLngLat(pt).addTo(map);
      m.on('drag',()=>{const ll=m.getLngLat();S.draft[i]=[ll.lng,ll.lat];drawDraft(false);moveMids();});
      m.on('dragend',()=>updateDrawStats());
      el.addEventListener('click',ev=>{ev.stopPropagation();S.selV=S.selV===i?null:i;drawDraft(true);render();});
      vMarkers.push(m);});
    if(d.length>=3)d.forEach((pt,i)=>{const nx=d[(i+1)%d.length],el=document.createElement('div');el.className='mid';el.textContent='+';el.title='Agregar un punto aquí';
      const m=new maplibregl.Marker({element:el}).setLngLat([(pt[0]+nx[0])/2,(pt[1]+nx[1])/2]).addTo(map);
      el.addEventListener('click',ev=>{ev.stopPropagation();const ll=m.getLngLat();S.draft.splice(i+1,0,[ll.lng,ll.lat]);S.selV=i+1;drawDraft(true);render();});
      mMarkers.push(m);});
  }
  $('#finishBtn').disabled=d.length<3;
}
function moveMids(){const d=S.draft;mMarkers.forEach((m,i)=>{const a=d[i],b=d[(i+1)%d.length];if(a&&b)m.setLngLat([(a[0]+b[0])/2,(a[1]+b[1])/2]);});}
function updateDrawStats(){const el=$('#drawArea');if(el)el.textContent=S.draft.length>2?fmtHa(areaHa(S.draft)):'—';const n=$('#drawN');if(n)n.textContent=S.draft.length;}
function startSpin(){if(!mapReady||spin)return;spin=setInterval(()=>{if(S.screen!=='welcome'){clearInterval(spin);spin=null;return;}map.setBearing(map.getBearing()+0.06);},30);}
function syncMap(first){
  if(!mapReady)return;
  clearInterval(yearTimer);
  const scr=S.screen;
  if(scr!=='draw'){clearHandles();map.getSource('draft').setData({type:'FeatureCollection',features:[]});}
  if(scr==='welcome'){setParcelsLayer();fly({center:[TOWN.lng,TOWN.lat],zoom:12.2,pitch:66,bearing:map.getBearing()});startSpin();}
  else if(scr==='parcels'){setParcelsLayer();if(S.parcels.length)fitPolys(S.parcels.map(p=>p.poly),{maxZoom:15.2,pitch:58});else fly({center:[TOWN.lng,TOWN.lat],zoom:13.2,pitch:62});}
  else if(scr==='locate'){setParcelsLayer();if(!S.gpsAt)fly({center:[TOWN.lng,TOWN.lat],zoom:14.3,pitch:55,bearing:-15});}
  else if(scr==='draw'){setParcelsLayer();drawDraft(true);if(S.draft.length>=3)fitPolys([S.draft],{pitch:35,maxZoom:17.5});}
  else if(scr==='quiz'||scr==='analyzing'){const p=S.quiz;setParcelsLayer(p&&p.id);if(p)fitPolys([p.poly],{pitch:58});}
  else if(scr==='parcel'){const p=curP();if(!p)return;setParcelsLayer(p.id);fitPolys([p.poly],{pitch:62});if(S.tab==='siembra')startYears(p);}
}
function startYears(p){
  clearInterval(yearTimer);const st=stageOf(p),np=nextPlan(p),rows=[];
  if(st)rows.push({l:'Ahora',c:st.key});if(np.next)rows.push({l:'Próxima',c:np.next.c});if(np.after)rows.push({l:'Después',c:np.after.c});
  if(!rows.length)return;let y=0;
  const tick=()=>{const r=rows[y];setParcelsLayer(p.id,CROP_COL[r.c]);const el=document.querySelector('#pm-'+p.id+' .pt');if(el)el.textContent=r.l+': '+r.c;
    document.querySelectorAll('.camp').forEach((n,i)=>n.classList.toggle('live',i===y));legendCycle(rows,y);y=(y+1)%rows.length;};
  tick();yearTimer=setInterval(tick,1900);
}

function setTop(html,dark){const o=$('#ovTop');if(!html){o.classList.add('hidden');return;}o.innerHTML=`<span class="pill ${dark?'dark':''}">${html}</span>`;o.classList.remove('hidden');}
function legendCycle(rows,y){const o=$('#ovLegend');o.innerHTML=`<div class="legend"><b>Tu parcela en el tiempo</b>${rows.map((r,i)=>`<div class="row ${i===y?'':'dim'}"><i style="background:${CROP_COL[r.c]||'#999'}"></i>${r.l}: ${r.c}</div>`).join('')}</div>`;o.classList.remove('hidden');}
function legendPisos(){const o=$('#ovLegend');o.innerHTML=`<div class="legend"><b>Piso de altura</b>${Object.values(PISOS).map(p=>`<div class="row"><i style="background:${p.col}"></i>${p.name}, ${p.range}</div>`).join('')}</div>`;o.classList.remove('hidden');}
function updateOverlays(){
  const scr=S.screen;$('#ovDraw').classList.toggle('hidden',scr!=='draw');
  if(scr==='welcome'){setTop(`${ic('sat',16)} Chiara, Ayacucho, relieve real 3D`);$('#ovLegend').classList.add('hidden');}
  else if(scr==='parcels'){setTop(S.parcels.length?`${ic('pin',16)} Tus parcelas, toca una para abrirla`:`${ic('sat',16)} Chiara, relieve real 3D`);S.parcels.length?legendPisos():$('#ovLegend').classList.add('hidden');}
  else if(scr==='locate'){setTop(S.gpsAt?`${ic('target',16)} Estás aquí`:`Busca tu parcela: arrastra y acerca el mapa`,!!S.gpsAt);$('#ovLegend').classList.add('hidden');}
  else if(scr==='draw'){setTop(S.draft.length<3?`Toca las esquinas de tu parcela (${S.draft.length} de al menos 3)`:`Arrastra los puntos para ajustar. El «+» agrega un punto`,true);$('#ovLegend').classList.add('hidden');}
  else if(scr==='parcel'){const p=curP();if(!p)return;if(S.tab==='siembra')return;const A=alertsFor(p)[0];
    setTop(A&&S.tab!=='datos'?`${ic(A.icon,16)} ${A.title}, ${A.when.toLowerCase()}`:`${ic('mountain',16)} ${p.name}, ${fmtM(p.stats.alt)}, piso ${PISOS[pisoOf(p.stats.alt)].name}`);legendPisos();}
  else {setTop('');$('#ovLegend').classList.add('hidden');}
}

const guide=t=>`<div class="guide"><div class="avatar">${ic('sprout',22)}</div><div class="bubble"><div class="txt">${t}</div><button class="listen" data-act="speak" aria-label="Escuchar">${icm('speaker',17)}</button></div></div>`;
const primary=(label,act,dis,icon='')=>`<button class="btn btn-primary" data-act="${act}" ${dis?'disabled':''}>${icon&&icon!=='arrow'?ic(icon,20):''}${label}</button>`;
const seg=(k,opts,val)=>`<div class="seg" role="group">${opts.map(o=>`<button data-act="set" data-k="${k}" data-v="${o[0]}" aria-pressed="${val===o[0]}">${o[2]?ic(o[2],17):''}${o[1]}</button>`).join('')}</div>`;
function climateChart(cl){
  const W=360,H=170,base=118,tMin=-6,tMax=24,ty=t=>12+(tMax-t)/(tMax-tMin)*(base-12);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lluvia, temperatura mínima y máxima, y humedad por mes">`;
  s+=`<rect x="0" y="${ty(0)}" width="${W}" height="${base-ty(0)}" fill="#ECEAFB" opacity=".8"/><text x="4" y="${ty(0)+11}" font-size="9.5" font-weight="700" fill="#5144C9" font-family="Atkinson Hyperlegible,sans-serif">bajo 0 °C = helada</text>`;
  s+=`<line x1="0" y1="${ty(0)}" x2="${W}" y2="${ty(0)}" stroke="#5144C9" stroke-dasharray="3 3" stroke-width="1"/>`;
  s+=`<rect x="${NM*30}" y="4" width="30" height="${base+34}" rx="6" fill="#18232E" opacity=".06"/>`;
  for(let i=0;i<12;i++){const h=cl.rain[i]/150*70;s+=`<rect x="${i*30+8}" y="${base-h}" width="14" height="${h}" rx="3" fill="#8DBEDC"/>`;}
  const line=(arr,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${arr.map((t,i)=>`${i*30+15},${ty(t).toFixed(1)}`).join(' ')}"/>`+arr.map((t,i)=>`<circle cx="${i*30+15}" cy="${ty(t).toFixed(1)}" r="3" fill="#fff" stroke="${col}" stroke-width="2"/>`).join('');
  s+=line(cl.tmax,'#D9783B')+line(cl.tmin,'#5144C9');
  for(let i=0;i<12;i++){s+=`<text x="${i*30+15}" y="${base+16}" text-anchor="middle" font-size="10" font-weight="700" fill="${i===NM?'#18232E':'#55606B'}" font-family="Atkinson Hyperlegible,sans-serif">${MONTHS[i]}</text>`;
    s+=`<text x="${i*30+15}" y="${base+34}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1662C4" font-family="Atkinson Hyperlegible,sans-serif">${cl.rh[i]}%</text>`;}
  return s+'</svg>';
}
function shade(hex,s){const n=parseInt(hex.slice(1),16);return `rgb(${((n>>16)&255)*s|0},${((n>>8)&255)*s|0},${(n&255)*s|0})`;}
function mix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const ch=k=>Math.round(((A>>k)&255)+(((B>>k)&255)-((A>>k)&255))*t);return `rgb(${ch(16)},${ch(8)},${ch(0)})`;}
function profileSVG(){
  const W=360,H=170,A0=2800,A1=4400,y=a=>14+(A1-a)/(A1-A0)*(H-28);
  const ridge=x=>A0+(A1-A0-140)*Math.pow(x/W,1.12)+60*Math.sin(x/34)+35*Math.sin(x/13+1);
  const pts=[];for(let x=0;x<=W;x+=4)pts.push([x,y(ridge(x))]);
  const xAt=a=>{let b=0,bd=1e9;for(let x=0;x<=W;x+=2){const d=Math.abs(ridge(x)-a);if(d<bd){bd=d;b=x;}}return b;};
  const area=`M0 ${H} L${pts.map(p=>p[0]+' '+p[1].toFixed(1)).join(' L')} L${W} ${H} Z`;
  const bands=[['puna',4000,4400],['suni',3500,4000],['quechua',2800,3500]];
  let s=`<svg class="profile" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil de altura de Chiara con tus parcelas"><defs><clipPath id="rc"><path d="${area}"/></clipPath></defs><g clip-path="url(#rc)">`;
  bands.forEach(([k,lo,hi])=>{s+=`<rect x="0" y="${y(hi)}" width="${W}" height="${y(lo)-y(hi)}" fill="${PISOS[k].col}"/>`;});
  bands.forEach(([k,lo])=>{s+=`<line x1="0" x2="${W}" y1="${y(lo)}" y2="${y(lo)}" stroke="#fff" stroke-opacity=".5" stroke-dasharray="3 4"/>`;});
  s+=`</g><polyline points="${pts.map(p=>p[0]+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#18232E" stroke-width="1.5" stroke-opacity=".55"/>`;
  bands.forEach(([k,lo,hi])=>{const yy=(y(lo)+y(Math.min(hi,ridge(W)-20)))/2;s+=`<text x="${W-8}" y="${yy+4}" text-anchor="end" font-size="12" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible,sans-serif">${PISOS[k].name}</text>`;});
  const lab=(x,yy,t,sub,col)=>`<circle cx="${x}" cy="${yy}" r="6" fill="${col}" stroke="#fff" stroke-width="2.5"/><text x="${x+10}" y="${yy-8}" font-size="12.5" font-weight="700" fill="#18232E" stroke="#fff" stroke-width="3" paint-order="stroke" font-family="Atkinson Hyperlegible,sans-serif">${t}</text>${sub?`<text x="${x+10}" y="${yy+6}" font-size="11" fill="#18232E" stroke="#fff" stroke-width="3" paint-order="stroke" font-family="Atkinson Hyperlegible,sans-serif">${sub}</text>`:''}`;
  const cx=xAt(TOWN.alt),cy=y(TOWN.alt);s+=`<circle cx="${cx}" cy="${cy}" r="4.5" fill="#18232E" stroke="#fff" stroke-width="2"/><line x1="${cx}" y1="${cy+5}" x2="${cx}" y2="${cy+22}" stroke="#fff" stroke-width="1.5"/><text x="${cx}" y="${cy+35}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible,sans-serif">Chiara (pueblo)</text>`;
  S.parcels.slice().sort((a,b)=>a.stats.alt-b.stats.alt).forEach(p=>{const x=xAt(p.stats.alt);s+=lab(Math.min(x,W-110),y(p.stats.alt),p.name,fmtM(p.stats.alt),alertsFor(p).some(a=>a.k==='frost')?'#5144C9':'#C8361B');});
  return s+'</svg>';
}

    <table class="dtab"><tbody>${rows.map(r=>`<tr><td>${r[0]}<small>${r[1]}, ${r[3]}</small>${r[5]}</td><td>${r[2]}.<small>Para: ${r[4].toLowerCase()}.</small></td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Datos de distinto tamaño, una sola escala</h3>
    <div class="scale">${[['SRTM','30 m',6],['MODIS','250 m',14],['SMAP','9 km',30],['POWER','50 km',54]].map(([n,r,w])=>`<div><i style="width:${w}px;height:${w}px"></i>${n}<br>${r}</div>`).join('')}</div>
    <p style="font-size:14.5px;line-height:1.5;margin:10px 0 0">Cada satélite mide en cuadros de distinto tamaño. Yachiraq lleva todo a la misma escala: <b>un valor por parcela y por mes</b>. La altura y la pendiente se miden en 50 puntos dentro de tu parcela. El clima de NASA POWER cubre una zona grande, por eso lo ajustamos a la altura exacta de tu parcela: unos 0,65 °C más frío por cada 100 m.</p></div>
  <div class="card"><h3>Satélite y estación en tierra</h3>
    <p style="font-size:14.5px;line-height:1.5;margin:0">Una estación mide el punto exacto donde está, pero en la sierra hay pocas y lejos. El satélite mide todos los lugares, pero da el promedio de un cuadro y a veces lo tapan las nubes. Lo mejor es juntarlos: el satélite para ver el patrón y la estación del SENAMHI o lo que observa el agricultor para confirmarlo.</p>
